/* ================= 存储 ================= */
const LS_STORE = "vpb.projects.v2";
const LS_LANG = "vpb.lang";
const LS_THEME = "vpb.theme";
const LS_TOOL = "vpb.tool";

let lang = "en";
try { if (localStorage.getItem(LS_LANG) === "zh") lang = "zh"; } catch(e) {}
function t(k){ return I18N[lang][k]; }

let tool = "general";
try { const tl = localStorage.getItem(LS_TOOL); if (TOOLS[tl]) tool = tl; } catch(e) {}

function uid() { return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function normalizeState(raw) {
  const s = {...blankState(), ...raw};
  // 兼容旧版的扁平字段 s0_size…
  if (!Array.isArray(raw.shots)) {
    const shots = [];
    for (let i = 0; i < MAX_SHOTS; i++) {
      if (raw[`s${i}_size`] === undefined) break;
      shots.push(shot(raw[`s${i}_size`], raw[`s${i}_move`], raw[`s${i}_action`] || "", raw[`s${i}_vo`] || ""));
    }
    if (shots.length) s.shots = shots;
  }
  Object.keys(s).forEach(k => { if (/^s\d+_/.test(k)) delete s[k]; });
  s.shots = s.shots.slice(0, MAX_SHOTS).map(x => ({...shot("Medium","Static","",""), ...x}));
  if (!s.shots.length) s.shots = [shot("Wide","Static","","")];
  return s;
}

function loadStore() {
  try {
    const raw = localStorage.getItem(LS_STORE);
    if (raw) {
      const st = JSON.parse(raw);
      if (st && st.projects && Object.keys(st.projects).length) {
        Object.values(st.projects).forEach(p => { p.data = normalizeState(p.data || {}); p.progress = p.progress || {}; });
        if (!st.projects[st.current]) st.current = Object.keys(st.projects)[0];
        return st;
      }
    }
  } catch(e) {}
  // 第一次打开:迁移旧版数据,否则用 Ethan 示例
  const id = uid();
  let data = clone(EXAMPLES[0].data), progress = {}, name = EXAMPLES[0].en.split(" (")[0];
  try {
    const old = localStorage.getItem("promptlab.video.v1");
    if (old) { data = normalizeState(JSON.parse(old)); name = data.name || "My project"; }
    const oldProg = localStorage.getItem("vpb.progress");
    if (oldProg) progress = JSON.parse(oldProg) || {};
  } catch(e) {}
  return {current:id, projects:{[id]:{name, data:normalizeState(data), progress, updated:Date.now()}}};
}
let store = loadStore();
function project() { return store.projects[store.current]; }
let state = project().data;
let progress = project().progress;

let saveTimer;
function saveStore() {
  project().updated = Date.now();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(LS_STORE, JSON.stringify(store)); } catch(e) {}
  }, 150);
}
function switchProject(id) {
  store.current = id;
  state = project().data;
  progress = project().progress;
  saveStore();
  renderAll();
}
function addProject(name, data) {
  const id = uid();
  store.projects[id] = {name, data:normalizeState(clone(data)), progress:{}, updated:Date.now()};
  switchProject(id);
}

const form = document.getElementById("form");
const shotForms = document.getElementById("shotForms");
const pad2 = n => String(n).padStart(2, "0");
const shotId = i => `S${pad2(i + 1)}`;

function optionsHtml(list, value) {
  return OPTS[list].map(o => `<option value="${o.v}"${o.v === value ? " selected" : ""}>${escapeHtml(o[lang])}</option>`).join("");
}
function fillOptions() {
  form.querySelectorAll("select[data-opts]").forEach(sel => {
    sel.innerHTML = optionsHtml(sel.dataset.opts, state[sel.dataset.k]);
  });
}
function writeForm() {
  form.querySelectorAll("[data-k]").forEach(el => { el.value = state[el.dataset.k] ?? ""; });
}

const X_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

function renderShotForms() {
  const n = state.shots.length;
  shotForms.innerHTML = state.shots.map((s, i) => {
    const id = f => `f_s${i}_${f}`;
    return `<div class="shot-form" data-shot="${i}">
      <div class="tag">${shotId(i)}
        <span style="display:flex;gap:6px">
          <button type="button" class="icon-btn" data-up="${i}" ${i === 0 ? "disabled" : ""} aria-label="${t("moveUp").replace("{id}", shotId(i))}" title="${t("moveUp").replace("{id}", shotId(i))}">${UP_ICON}</button>
          <button type="button" class="icon-btn" data-remove="${i}" ${n <= 1 ? "disabled" : ""} aria-label="${t("removeShot").replace("{id}", shotId(i))}" title="${t("removeShot").replace("{id}", shotId(i))}">${X_ICON}</button>
        </span>
      </div>
      <div class="field"><label for="${id("size")}">${t("size")}</label><select id="${id("size")}" data-f="size">${optionsHtml("size", s.size)}</select></div>

      <div class="field act"><label for="${id("action")}">${t("action")}</label><textarea id="${id("action")}" data-f="action" rows="2" placeholder="${t("actionPh")}">${escapeHtml(s.action)}</textarea></div>
      <div class="field vo"><label for="${id("vo")}">${t("vo")}</label><textarea id="${id("vo")}" data-f="vo" rows="2" placeholder="${escapeHtml(t("voPh"))}">${escapeHtml(s.vo)}</textarea></div>

    </div>`;
  }).join("");

  document.getElementById("addShot").disabled = n >= MAX_SHOTS;
}

form.addEventListener("input", onFormChange);
form.addEventListener("change", onFormChange);
function onFormChange(e) {
  const el = e.target;
  const box = el.closest("[data-shot]");
  if (box && el.dataset.f) {
    state.shots[+box.dataset.shot][el.dataset.f] = el.value;
  } else if (el.dataset.k) {
    state[el.dataset.k] = el.value;
    if (el.dataset.k === "stylePreset" && e.type === "change" && state.stylePreset !== "custom") {
      const st = STYLES[state.stylePreset];
      state.styleText = st.text;
      state.styleLock = st.lock;
      writeForm();
    }
  } else return;
  saveStore();
  render();
}

/* 镜头增删、上移;进度标记跟着镜头一起移动 */
function reorderProgress(map) {
  const next = {};
  Object.keys(progress).forEach(k => {
    const m = k.match(/^(still|video)(\d+)$/);
    if (!m) { next[k] = progress[k]; return; }
    const to = map(+m[2]);
    if (to !== null) next[m[1] + to] = progress[k];
  });
  Object.keys(progress).forEach(k => delete progress[k]);
  Object.assign(progress, next);
}
/* 3D 镜头与姿势(每个镜头可选) */
const angleOn = a => a && (a.useCam || a.usePose);
function angleWords(a) {
  const d = { camera: CamPose.describeCamera(a.cam, "en"), pose: CamPose.describePose(a.pose, a.cam, "en") };
  return { camera: a.useCam ? d.camera : "", pose: a.usePose ? d.pose : "" };
}
function angleSummary(s, i) {
  if (!angleOn(s.angle)) return `<button type="button" data-angle="${i}" title="${escapeHtml(t("angleHint"))}">＋ ${t("angleBtn")}</button>`;
  const w = angleWords(s.angle);

    <button type="button" data-angle="${i}">${t("angleEdit")}</button>`;
}

/* ================= 提示词生成 ================= */
function pron(p) {
  if (p === "she") return {S:"She", s:"she", o:"her", p:"her", n:"woman", v:w => w + "s"};
  if (p === "they") return {S:"They", s:"they", o:"them", p:"their", n:"person", v:w => w};
  return {S:"He", s:"he", o:"him", p:"his", n:"man", v:w => w + "s"};
}
function val(x, ph) { return (x || "").trim() || `[${ph}]`; }
function clean(x) { return x.trim().replace(/[\s.,;:!]+$/, ""); }
function end(x) { return clean(x) + "."; }
function art(w) { return /^[aeiou]/i.test(w) ? "an" : "a"; }
function lookList() {
  const items = ["hair","glasses","outfit","badge","shoes"].map(k => clean(state[k] || "")).filter(Boolean);
  return items.length ? items.join(", ") : "[hair, glasses, outfit…]";
}
function sizeDesc(size, g, loc) {
  switch (size) {
    case "Wide": return `wide shot, showing ${g.o} at full body with the whole ${loc} around ${g.o}`;
    case "Medium": return `medium shot, from the waist up`;
    case "Close-up": return `close-up on ${g.p} face and shoulders`;
    case "Over-the-shoulder": return `over-the-shoulder shot from just behind ${g.p} shoulder, showing what ${g.s} is looking at`;
    default: return `medium close-up, from the chest up`;
  }
}
const ORIENT = {"16:9":"landscape", "9:16":"vertical", "1:1":"square"};

function build() {
  const g = pron(state.pronoun);
  const tp = TOOLS[tool] || TOOLS.general;
  const st = STYLES[state.stylePreset] || STYLES.clay;
  const styleText = val(state.styleText, "art style");
  const lock = clean(val(state.styleLock, "style-lock details"));
  const guard = st.guard(g);
  const styleName = st.name;
  const ratio = tp.chat
    ? `Make the image ${state.ratio} ${ORIENT[state.ratio] || ""}.`.replace(" .", ".")
    : `${state.ratio} aspect ratio.`;
  const name = val(state.name, "name");
  const loc = clean(val(state.location, "location"));
  const light = state.light === "right" ? "right" : "left";
  const looks = lookList();
  const eth = clean(val(state.ethnicity, "ethnicity / look"));
  const role = clean(val(state.role, "role"));
  const ask = x => tp.chat ? x.replace(/^Create /, "Please create ") : x;

  const master = [
    ["style", (tp.chat ? "Please create an image. " : "") + end(styleText)],
    ["who", `Character design of ${name}, ${art(eth)} ${eth} ${g.n} in ${g.p} ${clean(val(state.age, "age range"))}, working as ${art(role)} ${role}.`],
    ["look", `Fixed look: ${looks}. ${g.S} ${g.v("look")} ${end(val(state.personality, "personality"))}`],
    ["pose", `Full-body front view, standing in a relaxed neutral pose with arms at ${g.p} sides and a gentle expression. Plain soft light-gray background, even soft light, centered with space around ${g.o}.`],
    ["rules", `One character only, no text, no logos. ${ratio}`]
  ];

  const glassesWord = clean(state.glasses || "");
  const closeup = (tp.chat
      ? `Please create a close-up portrait of the same character as the uploaded image: head and shoulders, turned slightly to the side, with a calm, gentle expression. `
      : `Same character as the uploaded image. Create a close-up portrait of ${g.o}, head and shoulders, turned slightly to the side, with a calm, gentle expression. `) +
    `Keep exactly the same face, hair, ${glassesWord ? glassesWord + ", " : ""}outfit and colors. ` +
    `Keep the ${styleName} style exactly: ${lock}. Even this close, no realistic skin texture, pores or wrinkles. ${guard} ` +
    `Plain soft light-gray background. One character only, no text, no logos. ${ratio}`;

  const background = (tp.chat ? "Please create an image. " : "") + `${end(styleText)} Setting: ${end(val(state.setting, "setting description"))} ` +
    `Soft daylight comes from the window on the ${light}. The room is empty and the chair is empty, ready for a character. ` +
    `Wide establishing view at eye level. Any screens show only simple abstract shapes. ` +
    `No people, no text, no logos. ${ratio}`;

  const shots = state.shots.map((sh, i) => {
    const size = sh.size, move = sh.move;
    const w3 = angleOn(sh.angle) ? angleWords(sh.angle) : { camera: "", pose: "" };
    const camera = w3.camera ? w3.camera : sizeDesc(size, g, loc);
    const poseExtra = w3.pose ? ` Body pose: ${w3.pose}.` : "";
    const action = clean(val(sh.action, "one simple action"));
    const vo = (sh.vo || "").trim();
    const close = CLOSE_SIZES.includes(size);
    const closeExtra = close
      ? ` Even this close, keep the ${styleName} look exactly: ${lock}. No realistic skin texture, pores or wrinkles. If a second image is uploaded, use it as the face reference.`
      : "";
    const keepLook = `${lock}, same ${looks}. ${guard}`;
    const tail = ` ${g.S} never ${g.v("look")} at the camera. No readable text, no logos. ${ratio}`;

    let still;
    if (i === 0) {
      still = `Create a new still image that places the same ${g.n} from the second uploaded image into the ${loc} from the first uploaded image. ` +
        `Camera: ${camera}. Pose: ${g.S} ${action}.${poseExtra} ` +
        `Keep ${g.o} exactly like the second uploaded image: ${keepLook} ` +
        `Keep the room, furniture, colors and the soft light from the window on the ${light} exactly the same as the first uploaded image.` +
        closeExtra + tail;
    } else {
      still = `Create a new still image of the same ${g.n} in the same ${loc} as the uploaded image, from a different camera angle: ${camera}. ` +
        `Pose: ${g.S} ${action}.${poseExtra} ` +
        `Keep everything else exactly the same as the uploaded image: same ${loc}, same furniture, same colors, same soft light from the window on the ${light}. ` +
        `Keep ${g.o} exactly like the uploaded image: ${keepLook}` +
        closeExtra + tail;
    }
    still = ask(still);

    const cam = move === "Slow push-in"
      ? `Slow, gentle push-in toward ${g.o}, no other camera movement.`
      : `Static camera, no camera movement.`;
    const lockSeg = tp.concise
      ? `Keep ${g.o}, the ${loc} and the ${styleName} style exactly as in the image.`
      : `Keep ${g.o} exactly as in the image: same face, same ${looks}, same ${styleName} style. Keep the ${loc}, colors and light unchanged.`;
    const rules = (tp.concise ? "Small, natural movement. " : "Small, natural movements only. ") +
      (tp.audio ? "Sound: quiet room ambience only, no speech, no music. " : "") +
      `One continuous shot, calm pacing, no cuts. ${g.S} never ${g.v("look")} at the camera.`;
    const video = [
      ["cam", (tp.chat ? "Please turn the uploaded image into a short video. " : "") + cam],
      ["act", `${g.S} ${action}.`],
      ["lock", lockSeg],
      ["rules", rules]
    ];
    const negative = tp.negative
      ? "looking at the camera, talking to the camera, realistic skin texture, wrinkles, extra fingers, distorted hands, distorted face, readable text, logos, watermark, camera shake, fast motion, scene cuts"
      : "";

    const words = vo ? vo.split(/\s+/).length : 0;
    const secs = Math.max(4, Math.min(10, Math.ceil(words / 2.5) + 1));
    const rawAction = sh.action || "";
    const clickWarn = /\b(click|press|tap|push|poke)\w*\b/i.test(rawAction) &&
      /\b(button|screen|monitor)\b/i.test(rawAction) && !/\b(mouse|keyboard|trackpad)\b/i.test(rawAction);

    return {
      id: shotId(i), size: w3.camera || size, move, action: clean(rawAction), vo, close, still, video, negative,
      videoText: video.map(s => s[1]).join(" "), secs, clickWarn, longWarn: words > 0 && secs > 6
    };
  });

  const tsvCell = x => String(x).replace(/[\t\r\n]+/g, " ");
  const head = ["Shot","Length","Shot size","Camera","Action","Voice & sound"];
  const rows = shots.map(s => [s.id, `~${s.secs} s`, s.size, s.move, s.action, s.vo ? `VO: "${s.vo}"` : ""]);
  const tsv = [head, ...rows].map(r => r.map(tsvCell).join("\t")).join("\n");

  return {master, masterText: master.map(s => s[1]).join(" "), closeup, background, shots, rows, tsv};
}

const MASTER_LEGEND = [["--seg-style","lgStyle"],["--seg-who","lgWho"],["--seg-look","lgLook"],["--seg-pose","lgPose"],["--seg-rules","lgRules"]];

  h += card("cardScript", "04", t("c4"), t("c4note"),

      <p class="shot-meta">${escapeHtml(s.action || "—")}</p>
      ${s.clickWarn ? `<div class="warn">${t("warnClick")}</div>` : ""}
      ${s.longWarn ? `<div class="warn">${t("warnLong").replace("{n}", s.secs)}</div>` : ""}
      <div class="pair">
        <div class="sub-block${progress["still" + i] ? " is-done" : ""}" id="still${i}">
          <div class="sub-head"><span>${t("still")}</span><div class="head-actions">${doneBtn("still" + i)}${copyBtn("still" + i)}</div></div>
          <div class="upload"><b>${t("upload")}</b>${escapeHtml(up)}</div>
          <div class="out">${escapeHtml(s.still)}</div>
        </div>
        <div class="sub-block${progress["video" + i] ? " is-done" : ""}" id="video${i}">
          <div class="sub-head"><span>${t("video")}</span><div class="head-actions">${doneBtn("video" + i)}${copyBtn("video" + i)}</div></div>
          <div class="upload">${t("upVideo")}</div>

          <div class="out">${segHtml(s.video)}</div>

        </div>
      </div>

  });
  h += `</section>`;

function copyText(key) {
  if (key === "master") return out.masterText;
  if (key === "closeup") return out.closeup;
  if (key === "background") return out.background;
  if (key === "tsv") return out.tsv;
  const m = key.match(/^(still|video|neg)(\d+)$/);
  if (m) {
    const s = out.shots[+m[2]];
    return m[1] === "still" ? s.still : m[1] === "video" ? s.videoText : s.negative;
  }
  return "";
}

function exportAll() {
  const L = [];
  L.push(`AI VIDEO PROMPTS — ${project().name} · ${state.name || "untitled"} (${state.ratio}) · Tool: ${TOOLS[tool].name}`, "");
  L.push("[1] Character master image", out.masterText, "");

  L.push("[3] Empty background", out.background, "");
  L.push("[4] Director script (TSV)", out.tsv, "");

    }, 1400);

});

async function copy(text, msg, done) {
  let ok = true;
  try {
    await navigator.clipboard.writeText(text);
  } catch (err) {
    // fallback
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand("copy"); } catch(e) { ok = false; }
    document.body.removeChild(ta);
  }
  showToast(ok ? msg : t("copyFail"));
  if (done) done(ok);
}

let toastTimer;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}

/* ================= 进度 ================= */
function progressItems() {
  const items = [
    {k:"master", label:t("pgMaster"), target:"cardMaster"},
    {k:"bg", label:t("pgBg"), target:"cardBg"},
    {k:"script", label:t("pgScript"), target:"cardScript"}
  ];
  state.shots.forEach((_, i) => {
    items.push({k:`still${i}`, label:`${shotId(i)} · ${t("pgStill")}`, target:`still${i}`});
    items.push({k:`video${i}`, label:`${shotId(i)} · ${t("pgVideo")}`, target:`video${i}`});
  });
  return items;
}
function renderProgress() {
  const items = progressItems();
  const done = items.filter(it => progress[it.k]).length;
  const next = items.find(it => !progress[it.k]);
  const pct = Math.round(done / items.length * 100);
  document.getElementById("progress").innerHTML = `
    <span class="pg-label">${t("pgLabel")}<span>${done} / ${items.length}</span></span>
    <span class="pg-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${items.length}" aria-valuenow="${done}"><i style="width:${pct}%"></i></span>
    <span class="pg-next">${next
      ? `<span class="hide-sm">${t("pgNext")}</span> <b>${escapeHtml(next.label)}</b>
         <button type="button" class="btn small" data-goto="${next.target}">${t("pgGo")} →</button>`
      : `<b>${t("pgAll")}</b>`}
      ${done ? `<button type="button" class="link-btn" id="pgReset">${t("pgReset")}</button>` : ""}</span>`;
}
document.getElementById("progress").addEventListener("click", e => {
  const g = e.target.closest("[data-goto]");
  if (g) {
    const el = document.getElementById(g.dataset.goto);
    el.style.scrollMarginTop = window.innerWidth > 900 ? "150px" : "80px";
    el.scrollIntoView({behavior:"smooth", block:"start"});
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
    return;
  }
  if (e.target.closest("#pgReset") && confirm(t("pgConfirm"))) {
    Object.keys(progress).forEach(k => delete progress[k]);
    saveStore();
    render();
  }
});

/* ================= 新手引导 ================= */
const TOUR_TARGETS = [null, "#exSel", "#toolSel", "#projectBar", "#tourChar", "#tourStyle", "#shotForms", "#cardMaster", "#cardBg", "#cardScript", "#shot0", "#progress", "#exportBtn"];
const tourEl = document.getElementById("tour");
const tourSpot = document.getElementById("tourSpot");
const tourCard = document.getElementById("tourCard");
let tourIdx = -1;
let tourOpener = null;
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

function tourTarget() {
  const sel = TOUR_TARGETS[tourIdx];
  const el = sel ? document.querySelector(sel) : null;
  // 下拉框本身太小,高亮它所在的整个字段
  return el && el.tagName === "SELECT" ? el.closest(".field") : el;
}
function startTour() {
  tourOpener = document.activeElement;
  tourIdx = 0;
  tourEl.hidden = false;
  try { localStorage.setItem("vpb.toured", "1"); } catch(e) {}
  document.getElementById("tourBtn").classList.remove("pulse");
  showTourStep();
}
function endTour() {
  tourEl.hidden = true;
  tourIdx = -1;
  if (tourOpener && tourOpener.focus) tourOpener.focus();
}
function showTourStep() {
  const steps = t("tour");
  const [title, body] = steps[tourIdx];
  document.getElementById("tourStep").textContent = t("tourStepOf").replace("{n}", tourIdx + 1).replace("{total}", steps.length);
  document.getElementById("tourTitle").textContent = title;
  document.getElementById("tourBody").innerHTML = body;
  document.getElementById("tourDots").innerHTML = steps.map((_, i) => `<i class="${i === tourIdx ? "on" : ""}"></i>`).join("");
  const back = document.getElementById("tourBack"), next = document.getElementById("tourNext");
  back.textContent = t("tourBack");
  back.disabled = tourIdx === 0;
  next.textContent = tourIdx === steps.length - 1 ? t("tourFinish") : t("tourNext");
  document.getElementById("tourClose").setAttribute("aria-label", t("close"));
  const el = tourTarget();
  tourEl.classList.toggle("no-target", !el);
  if (el) {
    const small = window.innerWidth < 640;
    const r = el.getBoundingClientRect();
    const fitsCenter = !small && r.height < window.innerHeight * 0.5;
    el.style.scrollMarginTop = "84px";
    el.scrollIntoView({behavior: reduceMotion.matches ? "auto" : "smooth", block: fitsCenter ? "center" : "start"});
  }
  positionTour();
  setTimeout(positionTour, 350);
  setTimeout(positionTour, 700);
  next.focus();
}
function positionTour() {
  if (tourIdx < 0) return;
  const el = tourTarget();
  if (!el) {
    tourCard.className = "tour-card center";
    tourCard.style.left = tourCard.style.top = "";
    return;
  }
  const pad = 8, topLimit = 64;
  const r = el.getBoundingClientRect();
  const top = Math.max(r.top - pad, topLimit);
  const bottom = Math.min(r.bottom + pad, window.innerHeight - 8);
  Object.assign(tourSpot.style, {
    left: (r.left - pad) + "px", top: top + "px",
    width: (r.width + pad * 2) + "px", height: Math.max(0, bottom - top) + "px"
  });
  if (window.innerWidth < 640) {
    tourCard.className = "tour-card sheet";
    tourCard.style.left = tourCard.style.top = "";
    return;
  }
  tourCard.className = "tour-card";
  const ch = tourCard.offsetHeight, cw = tourCard.offsetWidth;
  let y;
  if (window.innerHeight - bottom > ch + 24) y = bottom + 14;
  else if (top - topLimit > ch + 24) y = top - ch - 14;
  else y = window.innerHeight - ch - 20;
  const x = Math.min(Math.max(16, r.left), window.innerWidth - cw - 16);
  tourCard.style.left = x + "px";
  tourCard.style.top = y + "px";
}
function tourGo(delta) {
  const n = tourIdx + delta;
  if (n < 0) return;
  if (n >= t("tour").length) { endTour(); return; }
  tourIdx = n;
  showTourStep();
}
document.getElementById("tourNext").addEventListener("click", () => tourGo(1));
document.getElementById("tourBack").addEventListener("click", () => tourGo(-1));
document.getElementById("tourClose").addEventListener("click", endTour);
document.getElementById("tourBtn").addEventListener("click", startTour);
document.getElementById("guideBtn").addEventListener("click", startTour);
tourEl.addEventListener("click", e => { if (e.target === tourEl) endTour(); });
document.addEventListener("keydown", e => {
  if (tourIdx < 0) return;
  if (e.key === "Escape") endTour();
  else if (e.key === "ArrowRight") tourGo(1);
  else if (e.key === "ArrowLeft") tourGo(-1);
  else if (e.key === "Tab") {
    // 把焦点留在引导卡片里
    const f = [...tourCard.querySelectorAll("button:not(:disabled)")];
    const i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
  }
});
let tourRaf = 0;
function onViewportChange() {
  if (tourIdx < 0) return;
  cancelAnimationFrame(tourRaf);
  tourRaf = requestAnimationFrame(positionTour);
}
window.addEventListener("scroll", onViewportChange, {passive:true});
window.addEventListener("resize", onViewportChange);
try { if (!localStorage.getItem("vpb.toured")) document.getElementById("tourBtn").classList.add("pulse"); } catch(e) {}

/* ================= 语言 ================= */
function renderAll() {
  fillOptions();
  writeForm();
  renderShotForms();
  renderPickers();
  render();
}
function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.getElementById("tipsList").innerHTML = t("tips").map(x => `<li>${x}</li>`).join("");
  document.querySelectorAll("[data-lang-btn]").forEach(b => b.setAttribute("aria-pressed", b.dataset.langBtn === lang));
  studio.setLang(lang);
  renderAll();
  if (tourIdx >= 0) showTourStep();
}
document.querySelectorAll("[data-lang-btn]").forEach(b => b.addEventListener("click", () => {
  if (lang === b.dataset.langBtn) return;
  lang = b.dataset.langBtn;
  try { localStorage.setItem(LS_LANG, lang); } catch(e) {}
  applyLang();
}));

/* ================= 日间 / 夜间 ================= */
const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
function currentTheme() {
  return document.documentElement.dataset.theme || (darkQuery.matches ? "dark" : "light");
}
function syncThemeButtons() {
  const th = currentTheme();
  document.querySelectorAll("[data-theme-btn]").forEach(b => b.setAttribute("aria-pressed", b.dataset.themeBtn === th));
}
document.querySelectorAll("[data-theme-btn]").forEach(b => b.addEventListener("click", () => {
  document.documentElement.dataset.theme = b.dataset.themeBtn;
  try { localStorage.setItem(LS_THEME, b.dataset.themeBtn); } catch(e) {}
  syncThemeButtons();
}));
darkQuery.addEventListener("change", syncThemeButtons);
syncThemeButtons();

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

applyLang();
saveStore();
</script>
